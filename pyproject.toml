[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["scripts"]

[project]
name = "model-optimization-rl-post-training-101"
version = "0.1.0"
description = "A CPU-first course from gradients to supervised fine-tuning, preference optimization, and reinforcement learning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Santhosh Vaithiyanathan" }]
dependencies = []

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2"]
dev = ["mkdocs>=1.6,<2", "mypy>=1.13,<2", "ruff>=0.8,<1"]

[project.scripts]
pt101 = "pt101.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests", "scripts"]
